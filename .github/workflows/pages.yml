# Builds the example (the playground) for the web and deploys it to GitHub
# Pages: morphtext.drei.gg once the custom domain is set, and until then
# drei-gg.github.io/morphtext. The base path follows whichever is live.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - lib/**
      - example/**
      - pubspec.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Build the playground
        working-directory: example
        run: |
          flutter pub get
          flutter build web --release --base-href "${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
