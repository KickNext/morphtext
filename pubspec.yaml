name: morphtext
description: >-
  Text that morphs letter by letter, outline into outline: weight, size, font,
  one word into another, or into an icon. Built on morphnext's outline engine.
version: 0.2.0
homepage: https://morphtext.drei.gg
repository: https://github.com/drei-gg/morphtext
issue_tracker: https://github.com/drei-gg/morphtext/issues
topics:
  - text
  - animation
  - morphing
  - typography
  - icons

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  # Pinned exactly: MorphText reads glyph outlines and pairs them through
  # morphnext's internals (lib/src/engine.dart). Re-read those files before
  # any bump; see upstream/ for the two ways out of the pin.
  morphnext: 0.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
